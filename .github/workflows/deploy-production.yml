name: Deploy production

on:
  workflow_run:
    workflows: [Voice Agent CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pillar9-voice-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the tested main revision
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, x64, pillar9-voice-production]
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy
        env:
          DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha }}
          APP_DEPLOY_DIR: /var/www/pillar9-voice
          APP_ENV_FILE: /etc/pillar9-voice/voice.env
        run: bash scripts/deploy-production.sh
