# Local (with a public tunnel):   docker compose --profile tunnel up -d --build
# Server (behind Nginx/HTTPS):    docker compose up -d --build
#
# An explicit project name keeps this stack isolated from anything else already running
# on a shared company server.
name: pillar9-voice

services:
  # Only started by --profile tunnel, so a server deployment never runs it and never
  # needs an ngrok token.
  tunnel:
    profiles: ["tunnel"]
    image: ngrok/ngrok:latest
    restart: on-failure:2
    command: ["http", "voice-api:8787", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:-}"
    expose:
      - "4040"

  voice-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Empty on a server: PUBLIC_BASE_URL from .env is used instead of a tunnel URL.
      NGROK_API: "${NGROK_API:-}"
      DATABASE_PATH: /app/data/pillar9-voice.sqlite
    ports:
      # Bound to loopback so a shared server does not expose 8787 to the internet;
      # Nginx terminates TLS and proxies to it. APP_BIND_PORT avoids clashing with
      # services already using 8787 on that host.
      - "127.0.0.1:${APP_BIND_PORT:-8787}:8787"
    volumes:
      # Consents, do-not-contact records and call history must survive a rebuild.
      - voice-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  voice-data:
